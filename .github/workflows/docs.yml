name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege GITHUB_TOKEN. Without this block every job inherits the
# repository default, which on many repos is read/write — CodeQL flagged it on
# leak-guard, but docs had the identical exposure, so the grant is set once at
# workflow level rather than on the flagged job. That also means a job added
# here later inherits a safe default instead of the repository's — pin-guard
# did, and needed no permissions block of its own.
#
# contents: read is the entire requirement. All three jobs do nothing but read
# a checkout: docs runs markdownlint over the working tree, leak-guard runs git
# plumbing (ls-files, check-ignore) against the local index, pin-guard runs
# cat-file and diff against the local object store. None writes contents, posts
# a comment, or touches checks, packages, or releases. Widen in the job that
# needs it, never here.
permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: DavidAnson/markdownlint-cli2-action@2256fe35224a451507c8848ec825a4212e9eeb00 # v22
        with:
          globs: "**/*.md"

  # Enforces "Why This Repo Is Different" (CLAUDE.md). `claude plugin
  # marketplace add punt-labs/claude-plugins` clones this repo onto every
  # user's machine, with submodules, so the tracked file set IS the published
  # artifact. Until now that rule existed only as prose; PR #286 had to remove
  # a submodule and four plugin-state paths after they shipped. Runs on every
  # push and PR, ~10s, no network beyond the checkout.
  #
  # This job is intended to be a REQUIRED status check: every failure it
  # reports is fixable inside the PR that causes it — untrack the file, restore
  # the .gitignore rule — so blocking on it can never deadlock. The installer
  # pin check does not have that property and therefore lives in pin-guard
  # below, deliberately separate. Do not move it back in here; the reason is
  # written out at that job.
  leak-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Default fetch-depth: 1 is correct here. Every check in this job asks
      # about the index and the work tree, never about history.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: No submodules, no tracked plugin state
        run: |
          # errexit is NOT optional here and omitting it buys nothing: the
          # runner invokes `run:` blocks as `bash -e {0}`, so -e is already on
          # before the first line of this script. It is declared explicitly so
          # that executing this block locally reproduces CI exactly instead of
          # passing under a more forgiving shell.
          #
          # Reporting every violation in one build does NOT come from leaving
          # -e off. It comes from accumulating into $fail and exiting once at
          # the end, which requires every individual check to be non-fatal.
          #
          # `|| true` is banned here for anything that can also fail for a real
          # reason. It cannot tell "found nothing" from "could not look", and a
          # check that cannot tell those apart reports OK about a thing it
          # never examined. Branch on the exit status instead — every command
          # below does, and `git check-ignore` is the one that matters:
          # 0=ignored, 1=not ignored, anything else=git could not answer.
          set -euo pipefail
          fail=0

          # (a) Submodules do not merely leak, they break the install: the
          # clone recurses, and an SSH submodule URL fails auth before repo
          # visibility is consulted, aborting the whole marketplace add. Both
          # halves are checked because either can exist without the other —
          # .gitmodules is the wiring, the gitlink is the index entry.
          if [ -e .gitmodules ]; then
            echo "FAIL: .gitmodules exists."
            echo "    A submodule aborts \`claude plugin marketplace add\` for any user"
            echo "    without a GitHub SSH key. Remove the submodule; resolve identity"
            echo "    from the global ~/.punt-labs/ethos/ instead."
            fail=1
          fi
          index=""
          if ! index=$(git ls-files -s); then
            echo "FAIL: \`git ls-files -s\` failed; the index could not be read,"
            echo "    so the submodule check could not run."
            fail=1
          fi
          gitlinks=$(printf '%s\n' "$index" | awk '$1 == "160000"' | cut -f2-)
          if [ -n "$gitlinks" ]; then
            echo "FAIL: submodule gitlink(s) tracked in the index:"
            # printf, not echo: this prints a path that came from the index,
            # and bash's echo swallows a leading -n/-e. Every other variable
            # in this block is printed the same way.
            printf '%s\n' "$gitlinks" | sed 's/^/      /'
            echo "    Remove with: git rm --cached <path>"
            fail=1
          fi

          # (b) Anything both tracked and ignored. Derived from .gitignore, not
          # a second copy of it: an earlier version listed the paths by hand
          # here, and the two lists shipped out of sync on their first outing —
          # .github/workflows/biff-notify.yml was in .gitignore and missing
          # from the list, so it was tracked and reported OK. Asking git the
          # question directly cannot drift, and it picks up every future
          # .gitignore entry for free.
          #
          # --no-index is load-bearing. Without it `git check-ignore` refuses
          # to report tracked paths at all, so `git ls-files | git check-ignore
          # --stdin` matches nothing, ever — a check that always passes. The
          # flag exists for exactly this question: why did a path become
          # tracked when the rules say it should be ignored?
          #
          # .gitignore is the ENTIRE input to this check, so it is asserted
          # before its answer is trusted. `git check-ignore` reports "nothing
          # is ignored" (exit 1) both when the rules match nothing and when
          # there were no rules to read — indistinguishable outcomes. So
          # deleting .gitignore, or deleting the single line covering a path,
          # turns this FAIL into OK in the very commit that ships the leak.
          # Reproduced with .claude/settings.json tracked: intact .gitignore
          # gave "FAIL: these files are tracked ..."; `git rm .gitignore` gave
          # "OK: no submodules, no plugin state ..." at rc=0 with the file
          # still tracked. `chmod 000 .gitignore` did the same. The footer's
          # "do not delete this check" is no defence when the check can be
          # switched off from outside itself.
          #
          # One canary per rule, because a canary only ever pins its own rule.
          # An earlier version pinned four, all taken from .gitignore's
          # "narrower paths" block, and left the main block above it unpinned.
          # Deleting the single `.punt-labs/` line was then enough to track
          # .punt-labs/ethos/identities/claude.yaml — a plain `git add`, no -f
          # needed — and this job reported OK at rc=0. That is the team
          # registry vendored as ordinary files: the leak the footer names as
          # the reason the job exists. Check (a) does not cover it, because
          # de-submoduled files are not a submodule.
          #
          # The list below is therefore derived from .gitignore line by line,
          # and each path is chosen to match exactly ONE rule so a deleted rule
          # produces a named failure instead of a silent narrowing. --no-index
          # means none of these need to exist on disk.
          #
          # Every rule in .gitignore is pinned except `!.tmp/.gitkeep`, which
          # needs no canary: it is a negation, and deleting it makes a TRACKED
          # file ignored, which check (b) reports directly.
          #
          # Two limits this list does NOT close, named so nobody assumes they
          # are covered:
          #   1. It cannot know about a rule added to .gitignore after it was
          #      written. Adding a rule means adding a canary here.
          #   2. It detects coverage NARROWING, never WIDENING. Replacing
          #      `.claude/settings.json` with `.claude/` leaves every canary
          #      green while the next `git add -A` silently stops tracking
          #      .claude/hooks/check-branch.sh — the exact failure .gitignore
          #      argues against in prose where it declines to ignore that
          #      directory. Nothing here detects that; review does.
          if [ ! -f .gitignore ]; then
            echo "FAIL: .gitignore is missing. Every rule the leak check applies"
            echo "    lives there, so without it the check passes vacuously."
            fail=1
          elif [ ! -r .gitignore ]; then
            echo "FAIL: .gitignore is not readable, so its rules could not be applied"
            echo "    and the leak check would pass vacuously."
            fail=1
          fi
          # canary path                             # .gitignore rule it pins
          canaries=(
            'notes.local'                           # *.local
            'settings.local.json'                   # *.local.*
            '.tmp/scratch'                          # .tmp/*
            '.punt-labs/ethos/identities/x.yaml'    # .punt-labs/
            '.vox/vox.md'                           # .vox/
            '.lux/lux.md'                           # .lux/
            '.biff'                                 # .biff
            '.beads/config.yaml'                    # .beads/
            '.claude/agents/adb.md'                 # .claude/agents/
            '.claude/settings.json'                 # .claude/settings.json
            '.github/workflows/biff-notify.yml'     # .github/workflows/biff-notify.yml
            'imgui.ini'                             # imgui.ini
            'Lux.ini'                               # Lux.ini
            'Lux_Display.ini'                       # Lux_*.ini
            '.CLAUDE.md.lock'                       # .*.lock
          )
          for canary in "${canaries[@]}"; do
            # $? must be read inside the else branch: after a completed `if`
            # with no else, $? is the status of the `if` itself (0), not the
            # condition's — which reported every canary regression as a git
            # failure until this was fixed.
            if git check-ignore -q --no-index -- "$canary"; then
              continue
            else
              crc=$?
            fi
            if [ "$crc" -ne 1 ]; then
              echo "FAIL: \`git check-ignore\` exited $crc on $canary; git could not"
              echo "    answer, so this is a tooling failure rather than a .gitignore"
              echo "    regression. Check that the step runs inside the work tree."
              fail=1
              continue
            fi
            echo "FAIL: a canary path is no longer ignored: $canary"
            echo "    .gitignore has lost that rule. The leak check derives entirely"
            echo "    from .gitignore, so a deleted rule disables it silently rather"
            echo "    than loudly — which is why this canary exists."
            echo "    If the rule was renamed on purpose, update this canary list in"
            echo "    the same commit and say why in the message. Editing the list to"
            echo "    silence a rule you did not mean to drop is the failure case."
            fail=1
          done
          tracked=""
          if ! tracked=$(git ls-files); then
            echo "FAIL: \`git ls-files\` failed; the tracked set could not be read,"
            echo "    so the plugin-state check could not run."
            fail=1
          fi
          if [ -n "$tracked" ]; then
            if leaked=$(printf '%s\n' "$tracked" | git check-ignore --stdin --no-index); then
              echo "FAIL: these files are tracked even though .gitignore excludes them:"
              printf '%s\n' "$leaked" | sed 's/^/      /'
              echo "    Local tooling state, not catalog content. Untrack with"
              echo "    \`git rm --cached <path>\`."
              fail=1
            else
              rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "FAIL: \`git check-ignore\` exited $rc (expected 0 or 1);"
                echo "    the plugin-state check could not run."
                fail=1
              fi
            fi
          fi

          # There is deliberately no check on @-import lines in CLAUDE.md, and
          # this note exists so the next agent does not build one again. Four
          # attempts were made and each fixed its predecessor's defect while
          # adding a new one: a literal '^@\.punt-labs' caught one spelling of
          # seven; widening to line-leading tokens still missed the documented
          # inline form; scanning every token then failed the build on
          # `@.punt-labs/<tool>/CLAUDE.md` in this repo's own docs; adding
          # fence and code-span exclusions to fix that reintroduced a vacuous
          # pass, because an unclosed ```text fence swallows every line after
          # it and markdownlint has no unbalanced-fence rule to catch the
          # input. Correctly classifying an import means implementing
          # CommonMark in awk.
          #
          # The stakes did not justify it. A dangling import that ships means a
          # consumer's CLAUDE.md names a path they do not have, and Claude Code
          # ignores it — cosmetic. A missed submodule breaks their install and a
          # missed tracked-and-ignored file leaks the team roster, which is what
          # (a) and (b) prevent in four lines and one git pipeline. Enablement's
          # state files are still caught by (b); only the import line is
          # unguarded. If you are tempted to add this check back, the cost to
          # beat is a build that fails on a correct line, which is what teaches
          # people to delete checks.

          if [ "$fail" -ne 0 ]; then
            echo
            echo "Leak guard failed. Why this matters: everything tracked in this"
            echo "repo is cloned onto every marketplace consumer's machine, into"
            echo "~/.claude/plugins/marketplaces/punt-labs/, submodules and all."
            echo "The tracked file set IS the published artifact. Fix the files"
            echo "listed above — do not delete this check to get green, it is the"
            echo "only mechanical enforcement of CLAUDE.md's \"Why This Repo Is"
            echo "Different\". Note this job does not inspect @-import lines in"
            echo "CLAUDE.md; keeping those correct is still a human review step."
            echo "The installer URL pinned in README.md is checked separately, by"
            echo "the pin-guard job; nothing here says anything about it."
            exit 1
          fi
          echo "OK: no submodules tracked, and nothing tracked that .gitignore excludes."

  # Guards the OTHER install path. leak-guard covers `claude plugin marketplace
  # add`, which clones the whole repo; this covers the curl command in README's
  # Quick Start, which fetches ONE file from one pinned commit. GitHub serves a
  # commit-pinned raw URL immutably, which is the point of pinning and also the
  # failure mode: change install.sh without moving the pin and the advertised
  # installer stays the old one forever. It has gone stale twice — #286 changed
  # install.sh and left the pin behind, #288 changed install.sh again in the
  # very PR that claimed to fix the installer — and both times a human reviewer
  # caught it. Nothing mechanical did. Runs on every push and PR, ~10s, no
  # network beyond the checkout.
  #
  # THIS JOB MUST NOT BECOME A REQUIRED STATUS CHECK. The deadlock is airtight,
  # so read it before "fixing" a red main by adding pin-guard to branch
  # protection: a pin can only name a commit that ALREADY EXISTS, so the PR
  # that changes install.sh cannot pin to itself, and no other value passes
  # either — the only commit whose install.sh matches is the one that PR would
  # become, which the required check would be blocking from merging. No edit
  # turns that PR green. Requiring this job trades "the README may advertise a
  # stale installer for a few hours" for "install.sh can never be changed
  # again". A visible red X is the entire requirement here; enforcement is not.
  # leak-guard is the opposite case — every failure it reports is fixable
  # inside the offending PR — which is why that one is meant to be required and
  # this one is not.
  #
  # Intended sequence. The red at step 2 is expected and bounded, not a broken
  # build:
  #   1. A PR changes install.sh. leak-guard stays green; pin-guard goes red;
  #      the PR merges anyway, because this job is not required.
  #   2. main is red on pin-guard. The README does now advertise an installer
  #      the repo no longer contains — an accurate report of a real defect.
  #   3. The re-pin PR opens immediately, moving every installer URL in
  #      README.md to the SHA that install.sh change merged as. It goes green
  #      here, because that commit now exists.
  #   4. main returns green; the window is closed.
  # Step 3 being immediate is a process, not a gate — it is the one thing this
  # design cannot enforce, and the reason the red must stay loud.
  #
  # Scope decision, recorded so it is not re-litigated: the pattern matches a
  # fully-formed raw.githubusercontent.com .../install.sh URL ANYWHERE in
  # README.md — prose and fenced blocks alike. A bare SHA in a sentence ("the
  # fix landed in 2a7e501", as the CHANGELOG writes them) does NOT match and
  # cannot trip this; only a complete, copy-and-runnable URL does, and a reader
  # can copy one of those wherever it sits. Strict on purpose. To reference a
  # historical installer in prose, link the blob view instead —
  # github.com/punt-labs/claude-plugins/blob/<sha>/install.sh — which is not
  # runnable and does not match.
  pin-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 — full history, and load-bearing. This job resolves the
      # commit SHA that README.md pins the installer URL to, and
      # `git diff <sha> HEAD` needs that commit object present locally. The
      # default fetch-depth: 1 fetches HEAD alone, so every pin but the newest
      # resolves to "bad object" (`fatal: bad revision`, rc=128), which under
      # `set -e` aborts the step: an unexplained red rather than a pin report.
      #
      # The alternative was a targeted `git fetch --depth=1 origin <sha>` after
      # parsing the pin. Rejected on three counts: it puts a network call in
      # the middle of what is otherwise a local git question, so a transient
      # fetch failure becomes indistinguishable from a bad pin; it depends on
      # the checkout's persisted credentials and on GitHub answering want-SHA
      # requests, two things that can change under us; and it cannot be
      # reproduced by running this block against a plain local clone, which is
      # how it gets tested. Full history costs 528 KiB packed against 124 KiB
      # shallow (+404 KiB over 392 commits) — sub-second on a runner, bounded
      # by a catalog repo that holds no binaries. Revisit if that stops being
      # true.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: README pins the installer this repo ships
        run: |
          # Declared although the runner already invokes this as `bash -e {0}`,
          # so that running the block locally against a clone reproduces CI
          # exactly. `|| true` is banned here for the same reason as in
          # leak-guard: it cannot tell "found nothing" from "could not look".
          # Every command below branches on its exit status and accumulates
          # into $fail, so one build reports every problem it found.
          set -euo pipefail
          fail=0

          # Why this job exists, why it is not a required check, and when its
          # red is expected are all at the job comment above; they are not
          # repeated here, because two copies of a rationale drift apart. What
          # follows is about the code.
          #
          # This is a local git question, not a network one: the pinned commit
          # is in the object store (fetch-depth: 0 on the checkout above), so
          # `git diff` answers "is the advertised install.sh byte-identical to
          # ours" with no fetch. It compares HEAD, not the work tree — on a
          # pull_request run HEAD is the merge commit, so the answer is about
          # the state the PR produces, which is the state consumers get.
          #
          # Four outcomes, kept distinct because collapsing them is how the
          # sibling leak-guard job's early versions misreported: no pin at all,
          # disagreeing pins, an unresolvable pin (a checkout problem), and
          # drift. Only the last one means the pin is stale, and only it says
          # anything about the README being wrong.
          #
          # One consequence of pinning to a commit on a PR branch rather than
          # to one on main: after a squash merge it is reachable only from
          # refs/pull/*, which fetch-depth: 0 does not fetch, so main would
          # then report it as an unresolvable pin. Pin to commits on main.
          pin_re='https://raw\.githubusercontent\.com/punt-labs/claude-plugins/[0-9a-fA-F]{7,40}/install\.sh'
          pin=""
          if [ ! -r README.md ]; then
            echo "FAIL: README.md is missing or unreadable, so the installer pin could"
            echo "    not be read. The pinned URL is this check's entire input, so"
            echo "    without it the check would pass vacuously."
            fail=1
          else
            pins=""
            if pins=$(grep -nEo "$pin_re" README.md); then
              prc=0
            else
              # $? is only the grep status inside this else; after a completed
              # `if` it is the status of the `if`. Same trap as the canary loop.
              prc=$?
            fi
            if [ "$prc" -gt 1 ]; then
              echo "FAIL: \`grep\` exited $prc reading README.md, so the installer pin"
              echo "    could not be extracted. That is a tooling failure, not pin drift."
              fail=1
            elif [ "$prc" -eq 1 ]; then
              echo "FAIL: README.md advertises no commit-pinned installer URL. Expected"
              echo "    at least one occurrence of:"
              echo "      https://raw.githubusercontent.com/punt-labs/claude-plugins/<sha>/install.sh"
              echo "    where <sha> is 7-40 hex characters. Two near-misses do NOT count"
              echo "    and are why this is a failure rather than a skip: a branch-pinned"
              echo "    URL (.../main/install.sh) serves whatever main holds at fetch"
              echo "    time, which is the unpinned install #111 removed; and an"
              echo "    abbreviation shorter than 7 characters is not accepted here"
              echo "    because git resolves it ambiguously — lengthen it."
              echo "    Do not delete this check to get green. With no pin to compare"
              echo "    against, it would pass while the README advertises an installer"
              echo "    nothing verifies."
              fail=1
            else
              # tr collapses case so that two URLs differing only in hex case
              # are one pin, not a disagreement between identical SHAs.
              shas=$(printf '%s\n' "$pins" | sed -E 's#^.*/claude-plugins/([0-9a-fA-F]+)/install\.sh$#\1#' | tr '[:upper:]' '[:lower:]' | sort -u)
              if [ "$(printf '%s\n' "$shas" | wc -l)" -ne 1 ]; then
                echo "FAIL: README.md pins the installer to more than one commit:"
                printf '%s\n' "$shas" | sed 's/^/      /'
                echo "    Every occurrence in README.md, as <line>:<url>:"
                printf '%s\n' "$pins" | sed 's/^/      /'
                echo "    At most one of these can match the installer this repo ships, so"
                echo "    a reader who copies the Quick Start and a reader who copies the"
                echo "    inspect-before-running block get different scripts and at least"
                echo "    one gets the wrong one. Re-pin every occurrence to the same"
                echo "    commit in a single edit."
                fail=1
              else
                pin="$shas"
              fi
            fi
          fi
          if [ -n "$pin" ]; then
            if ! git cat-file -e "${pin}^{commit}" 2>/dev/null; then
              echo "FAIL: README.md pins the installer to commit $pin, which does not"
              echo "    resolve to a commit object in this checkout. Read this as a"
              echo "    CHECKOUT problem, not a stale pin — the pin has not been compared"
              echo "    to anything yet, so nothing here says it is wrong."
              echo "    Most likely: this job's actions/checkout lost \`fetch-depth: 0\`."
              echo "    The default fetch-depth: 1 fetches HEAD alone, so every pin but"
              echo "    the newest is absent and reports exactly like this."
              echo "    If fetch-depth: 0 is set, the pinned commit is reachable from no"
              echo "    branch or tag here — typically a squashed or force-pushed branch,"
              echo "    since fetch-depth: 0 does not fetch refs/pull/*. Re-pin to a"
              echo "    commit on main. (An ambiguous short SHA lands here too; lengthen"
              echo "    the abbreviation if git reports ambiguity.)"
              fail=1
            else
              drift=""
              if drift=$(git diff "$pin" HEAD -- install.sh); then
                if [ -n "$drift" ]; then
                  # The diff is evidence, not the message, and install.sh has
                  # been rewritten wholesale before — the full diff of that
                  # change is 150+ lines, enough to push the instruction out of
                  # a reader's screen. Capped, with the command to see the rest.
                  # sed truncates rather than head: `printf | head -n 40` closes
                  # the pipe early, and with pipefail that non-zero status ends
                  # the step under -e, losing every check after this one.
                  cap=40
                  n=$(printf '%s\n' "$drift" | wc -l | tr -d ' ')
                  echo "FAIL: README.md advertises a different install.sh than this repo ships."
                  echo "    Advertised: commit $pin — what the README's curl command"
                  echo "                actually fetches. raw.githubusercontent.com serves"
                  echo "                that path immutably, so it never catches up by itself."
                  echo "    Shipped:    HEAD $(git rev-parse --short HEAD) — differs by $n diff lines."
                  echo "    Below, a/ is the advertised script and b/ is the shipped one:"
                  printf '%s\n' "$drift" | sed -n "1,${cap}p" | sed 's/^/      /'
                  if [ "$n" -gt "$cap" ]; then
                    echo "      [$((n - cap)) more lines. Full diff: git diff $pin HEAD -- install.sh]"
                  fi
                  echo "    Fix by MOVING THE PIN, not by deleting this check: update every"
                  echo "    installer URL in README.md to a commit whose install.sh is"
                  echo "    byte-identical to the shipped one — normally the commit that"
                  echo "    carries the change (\`git rev-parse --short HEAD\` on main after"
                  echo "    it lands; on a pull_request run HEAD is an ephemeral merge"
                  echo "    commit, so do not pin to the SHA printed above)."
                  echo "    The pin must move in the same change as any install.sh edit,"
                  echo "    and where that is impossible — a commit cannot name its own"
                  echo "    SHA — in the immediate follow-up. See the note below."
                  fail=1
                fi
              else
                drc=$?
                echo "FAIL: \`git diff $pin HEAD -- install.sh\` exited $drc; the pinned"
                echo "    installer could not be compared, so this is a tooling failure"
                echo "    rather than pin drift."
                fail=1
              fi
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            echo
            echo "pin-guard failed. WHICH failure is stated above, and they are not"
            echo "interchangeable: a stale pin, disagreeing pins, no pin at all, and"
            echo "a pin this checkout cannot resolve are four problems with four"
            echo "different fixes. Only the first means the README is advertising the"
            echo "wrong installer; the last is a problem with this job, not the README."
            echo
            echo "Why the pin matters at all: the curl command in README's Quick Start"
            echo "is the install path for everyone who does not clone, and GitHub"
            echo "serves a pinned raw URL immutably, so a wrong pin hands them a"
            echo "different script indefinitely."
            echo
            echo "This job is deliberately NOT a required status check, and must not"
            echo "be made one. A pin can only name a commit that already exists, so"
            echo "the PR that changes install.sh cannot pin to itself and no edit"
            echo "makes it green; requiring this job would leave install.sh"
            echo "permanently unmergeable. Red here is a report, not a gate. Merge"
            echo "the install.sh change, then open the re-pin PR immediately — main"
            echo "stays red in between and that is an accurate description of the"
            echo "README. Fix the pin; do not delete the check, and do not require"
            echo "it."
            exit 1
          fi
          echo "OK: README.md pins the installer to the install.sh this repo ships."

